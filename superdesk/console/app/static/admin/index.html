<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>super控制台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="login-card">
    <div class="brand"><span class="logo"></span><div><b>super控制台</b><small>super远程桌面 管理后台</small></div></div>
    <label>用户名<input name="username" autocomplete="username" required></label>
    <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">登录</button>
    <p class="err" id="login-err"></p>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><span class="logo"></span><div><b>super控制台</b><small id="me"></small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <a href="/download/" target="_blank">下载中心 ↗</a>
      <a href="#" id="logout">退出登录</a>
    </div>
  </aside>
  <main>
    <header class="top"><button class="menu" id="menu" aria-label="菜单">☰</button><h1 id="title"></h1><div id="actions"></div></header>
    <section id="page"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="modal-actions" id="modal-actions"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
